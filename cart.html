<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина | Grill</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="indexcss.css">
    <link rel="stylesheet" href="cart.css">
</head>
<body>

<div class="cart-page">
    <div class="container">
        <div class="cart-page__header">
            <h1 class="cart-page__title">Корзина</h1>
            <p class="cart-page__subtitle">Ваши выбранные конфигурации</p>
        </div>

        <div class="cart-items" id="cartItems">
            <!-- Заполняется JS -->
        </div>

        <div class="cart-total" id="cartTotal" style="display: none;">
            <div class="cart-total__info">
                <span class="cart-total__label">Итого:</span>
                <span class="cart-total__price" id="cartTotalPrice">0 BYN</span>
            </div>
            <div class="cart-total__actions">
                <button class="btn btn--outline" id="clearCart">Очистить корзину</button>
                <button class="btn btn--primary" id="checkoutBtn">Оформить заказ</button>
            </div>
        </div>
    </div>
</div>

<script src="settings.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const API_URL = 'http://localhost:3000';
    const cartItemsEl = document.getElementById('cartItems');
    const cartTotalEl = document.getElementById('cartTotal');
    const cartTotalPriceEl = document.getElementById('cartTotalPrice');
    const clearCartBtn = document.getElementById('clearCart');
    const checkoutBtn = document.getElementById('checkoutBtn');

    async function loadCart() {
        try {
            const res = await fetch(`${API_URL}/cart`);
            const cart = await res.json();
            renderCart(cart);
        } catch (err) {
            cartItemsEl.innerHTML = '<p>Ошибка загрузки корзины</p>';
        }
    }

    function renderCart(cart) {
        cartItemsEl.innerHTML = '';
        
        if (cart.length === 0) {
            cartItemsEl.innerHTML = `
                <div class="cart-empty">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <h3>Корзина пуста</h3>
                    <p>Добавьте конфигурацию из конфигуратора</p>
                    <a href="configurator.html" class="btn btn--primary">Открыть конфигуратор</a>
                </div>
            `;
            cartTotalEl.style.display = 'none';
            return;
        }

        let total = 0;

        cart.forEach((item, index) => {
            total += item.totalPrice || 0;
            const div = document.createElement('div');
            div.className = 'cart-item';
            div.innerHTML = `
                <div class="cart-item__img">
                    <img src="${item.img || 'images/кухня1.png'}" alt="${item.title}">
                </div>
                <div class="cart-item__info">
                    <h3 class="cart-item__title">${item.title}</h3>
                    <div class="cart-item__specs">
                        <span class="cart-item__spec">${item.configuration?.config || ''}</span>
                        <span class="cart-item__spec">${item.configuration?.material || ''}</span>
                        <span class="cart-item__spec">${item.configuration?.grill || ''}</span>
                        <span class="cart-item__spec">${item.configuration?.size || ''}</span>
                        ${(item.configuration?.extras || []).map(e => `<span class="cart-item__spec">${e}</span>`).join('')}
                    </div>
                    <div class="cart-item__price">${(item.totalPrice || 0).toLocaleString('ru-RU')} BYN</div>
                </div>
                <button class="cart-item__remove" data-id="${item.id}" aria-label="Удалить">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            `;
            cartItemsEl.appendChild(div);
        });

        cartTotalPriceEl.textContent = total.toLocaleString('ru-RU') + ' BYN';
        cartTotalEl.style.display = 'flex';

        document.querySelectorAll('.cart-item__remove').forEach(btn => {
            btn.addEventListener('click', async () => {
                const id = btn.dataset.id;
                await fetch(`${API_URL}/cart/${id}`, { method: 'DELETE' });
                loadCart();
            });
        });
    }

    if (clearCartBtn) {
        clearCartBtn.addEventListener('click', async () => {
            if (!confirm('Очистить корзину?')) return;
            const res = await fetch(`${API_URL}/cart`);
            const cart = await res.json();
            for (const item of cart) {
                await fetch(`${API_URL}/cart/${item.id}`, { method: 'DELETE' });
            }
            loadCart();
        });
    }

    if (checkoutBtn) {
        checkoutBtn.addEventListener('click', async () => {
            const res = await fetch(`${API_URL}/cart`);
            const cart = await res.json();
            if (cart.length === 0) return;
            
            const request = {
                type: 'checkout',
                items: cart,
                totalPrice: cart.reduce((sum, item) => sum + (item.totalPrice || 0), 0),
                created_at: new Date().toISOString(),
                status: 'new'
            };
            
            await fetch(`${API_URL}/requests`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(request)
            });
            
            for (const item of cart) {
                await fetch(`${API_URL}/cart/${item.id}`, { method: 'DELETE' });
            }
            
            alert('Заказ оформлен! Мы свяжемся с вами в течение 15 минут.');
            window.location.href = 'index.html';
        });
    }

    loadCart();
});
</script>
</body>
</html>
